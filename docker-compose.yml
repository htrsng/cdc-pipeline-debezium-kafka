services:
  postgres-source:
    image: debezium/postgres:15
    container_name: postgres-source
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oltp_db
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
    ports:
      - "5432:5432"
    volumes:
      - ./init-scripts/source-init.sql:/docker-entrypoint-initdb.d/source-init.sql
      - postgres-source-data:/var/lib/postgresql/data

  postgres-dwh:
    image: postgres:15
    container_name: postgres-dwh
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dwh_db
    ports:
      - "5433:5432"
    volumes:
      - ./init-scripts/dwh-init.sql:/docker-entrypoint-initdb.d/dwh-init.sql
      - postgres-dwh-data:/var/lib/postgresql/data

  zookeeper:
    image: debezium/zookeeper:2.7.3.Final
    container_name: zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/zookeeper/data
      - zookeeper-txns:/zookeeper/txns

  kafka:
    image: debezium/kafka:2.7.3.Final
    container_name: kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - kafka-data:/kafka/data

  kafka-connect:
    image: debezium/connect:2.7.3.Final
    container_name: kafka-connect
    restart: unless-stopped
    depends_on:
      - kafka
      - postgres-source
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: cdc-connect-group
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses

volumes:
  postgres-source-data:
  postgres-dwh-data:
  zookeeper-data:
  zookeeper-txns:
  kafka-data: